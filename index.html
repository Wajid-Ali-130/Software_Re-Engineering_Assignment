/* localStorage / sessionStorage backed state */
function useStore(key, init, area = 'local') {
  const k = 'uos_lms_' + key;
  const st = () => { try { return area === 'session' ? window.sessionStorage : window.localStorage; } catch (e) { return null; } };
  const fresh = () => (typeof init === 'function' ? init() : init);
  const read = () => {
    try {
      const raw = st() && st().getItem(k);
      if (raw != null) return JSON.parse(raw);
    } catch (e) {}
    const nv = fresh();
    try { st() && st().setItem(k, JSON.stringify(nv)); } catch (e) {}
    return nv;
  };
  const [v, setV] = useState(read);
  const set = useCallback(u => {
    setV(prev => {
      const nv = typeof u === 'function' ? u(prev) : u;
      try { st() && st().setItem(k, JSON.stringify(nv)); } catch (e) {}
      return nv;
    });
  }, [k]);
  useEffect(() => {
    if (area !== 'local') return;
    const h = e => { if (e.key === k && e.newValue != null) { try { setV(JSON.parse(e.newValue)); } catch (_) {} } };
    window.addEventListener('storage', h);
    return () => window.removeEventListener('storage', h);
  }, [k]);
  return [v, set];
}

function calc(m, cr) {
  const vals = [m.a, m.s, m.m, m.f];
  const blank = vals.every(v => v === '' || v == null);
  const obt = Math.min(100, vals.reduce((x, v) => x + (Number(v) || 0), 0));

        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}
const Pct = ({ v, t }) => <span className={t === 0 ? '' : v < 75 ? 'text-red-600 font-bold' : ''}>{v}%</span>;
function Bar({ v, color }) {
  const c = color || (v < 75 ? '#dc3545' : v < 85 ? '#f0ad4e' : '#28a745');
  return <div className="h-2.5 bg-gray-200 rounded w-full min-w-[70px]"><div style={{ width: Math.min(100, v) + '%', background: c }} className="h-full rounded" /></div>;
}
function Avatar({ name, size = 40, src, ring }) {
  const st = { width: size, height: size, background: avColor(name), fontSize: size * 0.38, border: ring ? '4px solid #20c4c4' : 'none' };
  return src ? <img src={src} alt="" style={{ width: size, height: size, border: st.border }} className="rounded-full object-cover shrink-0" />
    : <div style={st} className="rounded-full text-white font-medium flex items-center justify-center shrink-0">{initials(name)}</div>;
}
function Empty({ children }) { return <div className="text-center text-gray-500 py-10 text-sm">{children}</div>; }
function CourseSelect({ value, onChange, codes }) {
  return <select className="inp" value={value} onChange={e => onChange(e.target.value)}>{codes.map(c => <option key={c} value={c}>{c} – {cName(c)}</option>)}</select>;
}
function Chip({ label, value, sub, tone }) {
  const tones = { red: 'border-red-300 bg-red-50 text-red-700', green: 'border-green-300 bg-green-50 text-green-700', blue: 'border-blue-300 bg-blue-50 text-blue-700', amber: 'border-amber-300 bg-amber-50 text-amber-800' };
  return <div className={`border rounded-lg px-4 py-3 ${tones[tone]}`}><div className="text-xs font-bold">{label}</div><div className="text-2xl font-bold leading-tight">{value}</div><div className="text-xs">{sub}</div></div>;
}

function unreadFor(chats, lastRead, t0, meId, role) {
  let n = 0;
  Object.keys(chats).forEach(key => {
    const mine = key.startsWith('grp') || (role === 'student' ? key.endsWith('|' + STUDENT.roll) : key.startsWith('t1|'));
    if (!mine) return;
    const lr = lastRead[meId + '|' + key] != null ? lastRead[meId + '|' + key] : t0;
    chats[key].forEach(m => { if (m.from !== meId && m.ts > lr) n++; });
  });
  return n;
}

function App() {
  const [session, setSession] = useSS('session', null);
  const [page, setPage] = useSS('page', 'dashboard');
  const [sessions, setSessions] = useLS('att_sessions', {});
  const [marks, setMarks] = useLS('marks', seedMarks);
  const [uploads, setUploads] = useLS('uploads', seedUploads);
  const [quizzes, setQuizzes] = useLS('quizzes', seedQuizzes);
  const [attempts, setAttempts] = useLS('attempts', []);
  const [chats, setChats] = useLS('chats', seedChats);
  const [lastRead, setLastRead] = useLS('lastread', {});
  const [t0] = useLS('t0', () => Date.now() - 60000);
  const [readIds, setReadIds] = useLS('readnotifs', []);
  const [fee, setFee] = useLS('fee', { due: '2026-10-09', paid: false });
  const [avatar, setAvatar] = useLS('avatar', null);
  const [examForm, setExamForm] = useLS('examform', null);
  const [, tick] = useState(0);
  useEffect(() => { const id = setInterval(() => tick(x => x + 1), 30000); return () => clearInterval(id); }, []);

  const role = session ? session.role : null;
  const me = role === 'teacher' ? { id: 'T:t1', name: TEACHER_USER.name } : { id: 'S:' + STUDENT.roll, name: STUDENT.name };
  const unreadMsgs = session ? unreadFor(chats, lastRead, t0, me.id, role) : 0;

  const stats = useMemo(() => {
    const six = COURSES.filter(c => c.sem === 'Sixth Semester');
    let T = 0, P = 0;
    six.forEach(c => { const a = attOf(sessions, STUDENT.roll, c.code); T += a.t; P += a.p; });
    return { overall: T ? Math.round((P * 100) / T) : 0, T, P };
  }, [sessions]);

  const notifs = useMemo(() => {
    if (!role) return [];
    const L = [];
    if (role === 'student') {
      const d = daysBetween(isoDate(), fee.due);
      if (fee.paid) L.push({ id: 'fee:paid:' + fee.due, level: 'ok', icon: 'cash', title: 'Semester fee paid', text: 'Admission to Next Higher Study challan (EIGHTH SEMESTER) is marked as PAID.', when: 'Fee status', go: 'admission' });
      else if (d < 0) L.push({ id: 'fee:over:' + fee.due, level: 'danger', icon: 'cash', title: 'Semester fee UNPAID: challan expired', text: `EIGHTH SEMESTER fee challan was due on ${dmy(fee.due)} (${-d} day${-d > 1 ? 's' : ''} overdue). Generate a new challan to pay.`, when: 'Fee status', go: 'admission' });
      else L.push({ id: 'fee:due:' + fee.due, level: d <= 3 ? 'warn' : 'info', icon: 'cash', title: 'Semester fee due ' + dmy(fee.due), text: `EIGHTH SEMESTER fee is unpaid. ${d === 0 ? 'Last day today!' : d + ' day(s) left.'}`, when: 'Fee status', go: 'admission' });

      L.push({ id: 'attall:' + stats.overall, level: stats.overall < 75 ? 'danger' : 'ok', icon: 'clock', title: `Live attendance: ${stats.overall}%`, text: stats.overall < 75 ? 'Your overall attendance is BELOW the 75% requirement. You may not be allowed in the exam.' : 'Your overall attendance is above the 75% requirement. Keep it up.', when: 'Live', go: 'attendance' });
      COURSES.filter(c => c.sem === 'Sixth Semester').forEach(c => {
        const a = attOf(sessions, STUDENT.roll, c.code);
        if (a.t > 0 && a.pct < 75) L.push({ id: `att:${c.code}:${a.pct}`, level: 'danger', icon: 'alert', title: `Attendance alert: ${c.name}`, text: `Only ${a.pct}% (${a.p}/${a.t}). Attend the next ${needMore(a.t, a.p)} class(es) in a row to reach 75%.`, when: 'Live', go: 'attendance' });
      });
      [...uploads].sort((a, b) => b.ts - a.ts).slice(0, 5).forEach(u => {
        const isA = u.type === 'Assignment';
        L.push({ id: 'up:' + u.id, level: 'info', icon: isA ? 'folder' : 'upload', title: isA ? `New Assignment uploaded in ${cName(u.course)}` : `New material uploaded in ${cName(u.course)}`, text: `${u.title}${u.due ? ' · Due ' + dmy(u.due) : ''}`, when: timeAgo(u.ts), go: 'downloads' });
      });
      quizzes.forEach(q => { if (!attempts.find(a => a.quizId === q.id && a.roll === STUDENT.roll)) L.push({ id: 'quiz:' + q.id, level: 'warn', icon: 'quiz', title: `Quiz available: ${cName(q.course)}`, text: `${q.title} · ${q.questions.length} questions · ${q.minutes} min`, when: timeAgo(q.ts), go: 'quizzes' }); });
    } else {
      ['SE23514', 'SE23515'].forEach(code => {
        const low = ROSTER.filter(s => { const a = attOf(sessions, s.roll, code); return a.t > 0 && a.pct < 75; });
        if (low.length) L.push({ id: `low:${code}:${low.length}`, level: 'danger', icon: 'alert', title: `${low.length} student(s) below 75% in ${cName(code)}`, text: low.slice(0, 3).map(s => s.name).join(', ') + (low.length > 3 ? ' …' : ''), when: 'Live', go: 'reports' });
      });
      attempts.slice(-3).reverse().forEach(a => { const qz = quizzes.find(q => q.id === a.quizId); L.push({ id: 'att:' + a.id, level: 'info', icon: 'quiz', title: `${a.name} submitted a quiz`, text: `${qz ? qz.title : 'Quiz'}: ${a.score}/${a.total}`, when: timeAgo(a.ts), go: 'quizzes' }); });
    }
    if (unreadMsgs > 0) L.push({ id: 'msg:' + unreadMsgs, level: 'info', icon: 'chat', title: `${unreadMsgs} unread message${unreadMsgs > 1 ? 's' : ''}`, text: role === 'student' ? 'Your teachers have sent you new messages.' : 'Students have sent you new messages.', when: 'Chat', go: 'chat' });
    return L;
  }, [role, fee, stats, sessions, uploads, quizzes, attempts, unreadMsgs]);

  const unreadNotifs = notifs.filter(n => !readIds.includes(n.id)).length;
  const markRead = ids => setReadIds(r => Array.from(new Set([...r, ...ids])));

  const go = useCallback(p => { setPage(p); window.scrollTo(0, 0); }, []);
  const login = r => { setSession({ role: r }); setPage('dashboard'); try { sessionStorage.removeItem('uos_lms_survey'); } catch (e) {} };
  const logout = () => { setSession(null); setPage('dashboard'); };
  const resetAll = () => {
    if (!window.confirm('Reset all demo data (chats, attendance, marks, uploads, quizzes)?')) return;
    try { Object.keys(localStorage).filter(k => k.startsWith('uos_lms_')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    window.location.reload();
  };

  const value = { role, me, page, go, session, login, logout, resetAll, sessions, setSessions, marks, setMarks, uploads, setUploads, quizzes, setQuizzes, attempts, setAttempts, chats, setChats, lastRead, setLastRead, t0, fee, setFee, avatar, setAvatar, examForm, setExamForm, stats, notifs, readIds, markRead, unreadNotifs, unreadMsgs };

  return <Ctx.Provider value={value}>{session ? <Shell /> : <LoginPage />}</Ctx.Provider>;
}

function ImageModal({ onClose }) {
  const { setAvatar } = useApp();
  const [prev, setPrev] = useState(null);
  const onFile = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); const s = 200; c.width = c.height = s;
        const ctx = c.getContext('2d'); const m = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
        setPrev(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  return (
    <Modal title="Update Profile Image" onClose={onClose}>
      <input type="file" accept="image/*" onChange={onFile} className="inp" />
      {prev && <img src={prev} alt="preview" className="w-32 h-32 rounded-full object-cover mt-4 border-4 border-[#20c4c4]" />}
      <div className="flex gap-2 mt-5 justify-end">
        <button className="btn btn-gray" onClick={() => { setAvatar(null); onClose(); }}>Remove image</button>
        <button className="btn" disabled={!prev} onClick={() => { setAvatar(prev); onClose(); }}>Save image</button>
      </div>
    </Modal>
  );
}
function PasswordModal({ onClose }) {
  const [a, setA] = useState(''), [b, setB] = useState(''), [c, setC] = useState(''), [msg, setMsg] = useState(null);
  const save = () => {
    if (!a) return setMsg(['err', 'Enter your current password.']);
    if (b.length < 6) return setMsg(['err', 'New password must be at least 6 characters.']);
    if (b !== c) return setMsg(['err', 'New password and confirmation do not match.']);
    setMsg(['ok', 'Password changed successfully (demo).']); setTimeout(onClose, 1200);
  };
  return (
    <Modal title="Change Password" onClose={onClose}>
      <label className="lbl">Current password</label><input type="password" className="inp" value={a} onChange={e => setA(e.target.value)} />
      <label className="lbl">New password</label><input type="password" className="inp" value={b} onChange={e => setB(e.target.value)} />
      <label className="lbl">Confirm new password</label><input type="password" className="inp" value={c} onChange={e => setC(e.target.value)} />
      {msg && <div className={`mt-3 text-sm ${msg[0] === 'err' ? 'text-red-600' : 'text-green-700'}`}>{msg[1]}</div>}

    </Modal>

}

    case 'results': return <ResultBoard />;
    case 'admission': return <Admission />;
    case 'scholarship': return <Scholarship />;
    case 'downloads': return <Downloads />;
    case 'chat': return <ChatPage />;
    case 'quizzes': return T ? <QuizTeacher /> : <QuizStudent />;
    case 'reports': return T ? <ReportsTeacher /> : <ReportsStudent />;
    case 'grades': return <Grades />;
    case 'materials': return <Materials />;
    case 'evaluation': return <Evaluation />;
    case 'hec': return <HecSurvey />;
    case 'pickdrop': return <PickDrop />;
    case 'library': return <Library />;
    case 'hostel': return <Hostel />;
    default: return <Dashboard />;
  }
}

function TeacherAttendance() {
  const { sessions, setSessions } = useApp();
  const [code, setCode] = useState(TEACHER_COURSES[0]);
  const [date, setDate] = useState(isoDate());
  const key = code + '|' + date;
  const cur = sessions[key] || {};
  const setOne = (roll, st) => setSessions(s => { const o = { ...(s[key] || {}) }; if (o[roll] === st) delete o[roll]; else o[roll] = st; return { ...s, [key]: o }; });
  const markAll = st => setSessions(s => ({ ...s, [key]: Object.fromEntries(ROSTER.map(r => [r.roll, st])) }));
  const clearAll = () => setSessions(s => { const n = { ...s }; delete n[key]; return n; });
  const count = st => ROSTER.filter(r => cur[r.roll] === st).length;
  const unmarked = ROSTER.filter(r => !cur[r.roll]).length;
  const rows = ROSTER.map(r => ({ r, ...attOf(sessions, r.roll, code) }));
  const classAvg = Math.round(rows.reduce((x, r) => x + r.pct, 0) / rows.length);
  const hist = Object.keys(sessions).filter(k => k.startsWith(code + '|') && Object.keys(sessions[k] || {}).length).map(k => k.split('|')[1]).sort().reverse();
  const stBtn = (roll, st, label, on) => <button onClick={() => setOne(roll, st)} className={`px-3 py-1.5 text-xs font-bold rounded border ${cur[roll] === st ? on + ' text-white border-transparent' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`}>{label}</button>;
  return (
    <Card title="Mark Attendance">
      <div className="grid md:grid-cols-[1fr_200px] gap-3">
        <div><label className="lbl !mt-0">Course</label><CourseSelect value={code} onChange={setCode} codes={TEACHER_COURSES} /></div>
        <div><label className="lbl !mt-0">Class date</label><input type="date" className="inp" value={date} max={isoDate()} onChange={e => e.target.value && setDate(e.target.value)} /></div>
      </div>
      <div className="flex flex-wrap gap-2 my-4 items-center">
        <button className="btn btn-green" onClick={() => markAll('P')}>Mark All Present</button>
        <button className="btn btn-red" onClick={() => markAll('A')}>Mark All Absent</button>
        <button className="btn btn-gray" onClick={clearAll}>Clear</button>
        <div className="ml-auto text-xs text-gray-600 flex flex-wrap gap-3">
          <span className="text-green-700 font-bold">Present {count('P')}</span><span className="text-red-600 font-bold">Absent {count('A')}</span>
          <span className="text-amber-700 font-bold">Leave {count('L')}</span><span>Unmarked {unmarked}</span><span className="font-bold">Class avg {classAvg}%</span>
        </div>
      </div>
      <div className="overflow-x-auto">
        <table className="tbl">
          <thead><tr><th>S.NO</th><th>ROLL NO</th><th>NAME</th><th>TODAY'S STATUS</th><th className="text-center">TOTAL</th><th className="text-center">PRESENT</th><th>LIVE %</th></tr></thead>
          <tbody>
            {rows.map(({ r, t, p, pct }, i) => (
              <tr key={r.roll} className={t > 0 && pct < 75 ? 'bg-red-50' : ''}>
                <td>{i + 1}</td><td>{r.roll}</td><td className="font-medium">{r.name}</td>
                <td><div className="flex gap-1">{stBtn(r.roll, 'P', 'Present', 'bg-green-600')}{stBtn(r.roll, 'A', 'Absent', 'bg-red-600')}{stBtn(r.roll, 'L', 'Leave', 'bg-amber-500')}</div></td>
                <td className="text-center">{t}</td><td className="text-center">{p}</td>
                <td><div className="flex items-center gap-2 min-w-[120px]"><Pct v={pct} t={t} /><Bar v={pct} /></div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-gray-500 mt-3">Changes save instantly. Leave counts as an excused class (treated as present). Students below 75% are highlighted red and receive an alert.</p>
      {hist.length > 0 && (
        <div className="mt-4"><div className="font-bold text-sm mb-2">Session history for this course</div>
          <div className="flex flex-wrap gap-2">{hist.map(d => <button key={d} onClick={() => setDate(d)} className={`text-xs px-3 py-1 rounded border ${d === date ? 'bg-uos text-white' : 'bg-white'}`}>{dmy(d)}</button>)}</div></div>
      )}
    </Card>
  );
}

function Grades() {
  const { marks, setMarks } = useApp();
  const [code, setCode] = useState(TEACHER_COURSES[0]);
  const [saved, setSaved] = useState(false);
  const course = cOf(code);
  const rows = ROSTER.map(s => { const m = (marks[code] && marks[code][s.roll]) || { a: '', s: '', m: '', f: '' }; return { s, m, ...calc(m, course.cr) }; });
  const filled = rows.filter(r => !r.blank);
  const avg = filled.length ? (filled.reduce((x, r) => x + r.obt, 0) / filled.length).toFixed(1) : '--';
  const classGpa = filled.length ? (filled.reduce((x, r) => x + r.gp, 0) / filled.length).toFixed(2) : '--';
  const passRate = filled.length ? Math.round((filled.filter(r => r.pass).length * 100) / filled.length) : 0;
  const upd = (roll, f, v) => {
    const val = v === '' ? '' : Math.max(0, Math.min(MAXES[f], Number(v)));
    setMarks(M => ({ ...M, [code]: { ...(M[code] || {}), [roll]: { a: '', s: '', m: '', f: '', ...((M[code] || {})[roll] || {}), [f]: val } } }));
    setSaved(true); setTimeout(() => setSaved(false), 1200);
  };
  return (
    <Card title="Grades / Marks Entry" right={<span className={`text-xs transition ${saved ? 'opacity-100' : 'opacity-0'}`}>Saved ✓</span>}>
      <label className="lbl !mt-0">Course ({course.cr} credit hour{course.cr > 1 ? 's' : ''})</label>
      <CourseSelect value={code} onChange={setCode} codes={TEACHER_COURSES} />
      <div className="overflow-x-auto mt-4">
        <table className="tbl">
          <thead><tr><th>ROLL NO</th><th>NAME</th><th className="text-center">ATTEN. (10)</th><th className="text-center">ASSIGN. (20)</th><th className="text-center">MID (30)</th><th className="text-center">FINAL (50)</th><th className="text-center">TOTAL</th><th className="text-center">GRADE</th><th className="text-center">GP</th><th className="text-center">QP</th><th>REMARKS</th></tr></thead>
          <tbody>
            {rows.map(({ s, m, blank, obt, g, gp, qp, pass }) => (
              <tr key={s.roll}>
                <td>{s.roll}</td><td className="font-medium">{s.name}</td>
                {['a', 's', 'm', 'f'].map(f => <td key={f} className="text-center"><input type="number" min="0" max={MAXES[f]} className="num" value={m[f]} onChange={e => upd(s.roll, f, e.target.value)} /></td>)}
                <td className="text-center font-bold">{blank ? '--' : obt}</td><td className="text-center font-bold">{blank ? '--' : g}</td><td className="text-center">{blank ? '--' : gp.toFixed(1)}</td><td className="text-center">{blank ? '--' : qp}</td>

function Materials() {
  const { uploads, setUploads } = useApp();
  const [f, setF] = useState({ course: TEACHER_COURSES[0], type: 'Lecture Material', title: '', desc: '', due: addDays(7) });
  const [file, setFile] = useState(null);
  const [prog, setProg] = useState(null);
  const [err, setErr] = useState('');
  const [drag, setDrag] = useState(false);
  const input = useRef(null);
  const take = fl => { if (fl) { setFile(fl); setErr(''); if (!f.title) setF(x => ({ ...x, title: fl.name.replace(/\.[^.]+$/, '') })); } };
  const submit = () => {
    if (!f.title.trim()) return setErr('Please enter a title.');
    if (!file) return setErr('Please choose a file to upload.');
    setErr(''); setProg(0);
    const reader = new FileReader();
    let dataUrl = null, done = false;
    reader.onload = () => { dataUrl = file.size <= 700 * 1024 ? reader.result : null; done = true; };
    reader.onerror = () => { done = true; };
    reader.readAsDataURL(file);
    let p = 0;
    const id = setInterval(() => {
      p += 20; setProg(Math.min(p, 100));
      if (p >= 100 && done) {
        clearInterval(id);
        setUploads(u => [{ id: uid(), course: f.course, type: f.type, title: f.title.trim(), desc: f.desc.trim(), due: f.type === 'Assignment' ? f.due : '', ts: Date.now(), fileName: file.name, size: file.size, data: dataUrl }, ...u]);
        setTimeout(() => { setProg(null); setFile(null); setF(x => ({ ...x, title: '', desc: '' })); if (input.current) input.current.value = ''; }, 500);
      }
    }, 120);
  };
  return (
    <>
      <Card title="Upload Materials & Assignments">
        <div className="grid md:grid-cols-2 gap-x-4">
          <div><label className="lbl !mt-0">Course</label><CourseSelect value={f.course} onChange={v => setF({ ...f, course: v })} codes={TEACHER_COURSES} /></div>
          <div><label className="lbl !mt-0">Type</label><select className="inp" value={f.type} onChange={e => setF({ ...f, type: e.target.value })}><option>Lecture Material</option><option>Assignment</option><option>Lab Manual</option></select></div>
          <div><label className="lbl">Title</label><input className="inp" value={f.title} onChange={e => setF({ ...f, title: e.target.value })} placeholder="e.g. Assignment 4: UML Diagrams" /></div>
          {f.type === 'Assignment' && <div><label className="lbl">Due date</label><input type="date" className="inp" value={f.due} onChange={e => setF({ ...f, due: e.target.value })} /></div>}
        </div>
        <label className="lbl">Description</label><textarea className="inp" rows={2} value={f.desc} onChange={e => setF({ ...f, desc: e.target.value })} />
        <div onDragOver={e => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)} onDrop={e => { e.preventDefault(); setDrag(false); take(e.dataTransfer.files[0]); }}
          onClick={() => input.current && input.current.click()} className={`mt-4 border-2 border-dashed rounded-lg p-8 text-center cursor-pointer ${drag ? 'border-uos bg-blue-50' : 'border-gray-300'}`}>
          <Icon n="upload" size={34} className="mx-auto text-uos" />
          <div className="mt-2 text-sm">{file ? <b>{file.name} ({(file.size / 1024).toFixed(1)} KB)</b> : 'Drag & drop a file here, or click to browse'}</div>
          <input ref={input} type="file" className="hidden" onChange={e => take(e.target.files[0])} />
        </div>
        {prog !== null && <div className="mt-3"><div className="h-3 bg-gray-200 rounded"><div className="h-full bg-green-500 rounded transition-all" style={{ width: prog + '%' }} /></div><div className="text-xs mt-1">{prog < 100 ? `Uploading… ${prog}%` : 'Upload complete ✓'}</div></div>}
        {err && <div className="text-red-600 text-sm mt-2">{err}</div>}
        <div className="text-right mt-4"><button className="btn" disabled={prog !== null} onClick={submit}>Upload to students</button></div>
        <p className="text-xs text-gray-500">Students are notified instantly: “New Assignment uploaded in &lt;subject&gt;”.</p>
      </Card>
      <Card title="Uploaded Items">
        {uploads.length === 0 ? <Empty>Nothing uploaded yet.</Empty> : (
          <div className="overflow-x-auto"><table className="tbl"><thead><tr><th>S.NO</th><th>COURSE</th><th>TYPE</th><th>TITLE</th><th>UPLOADED</th><th>DUE</th><th>FILE</th><th></th></tr></thead>
            <tbody>{uploads.map((u, i) => (
              <tr key={u.id}><td>{i + 1}</td><td>{cName(u.course)}</td><td>{u.type}</td><td className="font-medium">{u.title}</td><td>{fmtLong(u.ts)}</td><td>{u.due ? dmy(u.due) : '-'}</td>
                <td><button className="text-[#0b6bf0] underline" onClick={() => downloadUpload(u)}>{u.fileName}</button></td>
                <td><button className="text-red-600" aria-label="Delete" onClick={() => setUploads(x => x.filter(y => y.id !== u.id))}><Icon n="trash" size={18} /></button></td></tr>
            ))}</tbody></table></div>
        )}
      </Card>
    </>
  );
}

function QuizStudent() {
  const { quizzes, attempts, setAttempts } = useApp();
  const [run, setRun] = useState(null);
  const [view, setView] = useState(null);
  const mine = id => attempts.find(a => a.quizId === id && a.roll === STUDENT.roll);
  const finish = (quiz, ans) => {
    const score = quiz.questions.reduce((x, q, i) => x + (ans[i] === q.ans ? 1 : 0), 0);
    const at = { id: uid(), quizId: quiz.id, roll: STUDENT.roll, name: STUDENT.name, score, total: quiz.questions.length, answers: ans, ts: Date.now() };
    setAttempts(a => [...a, at]); setRun(null); setView(quiz.id);
  };
  if (run) return <QuizRunner quiz={run} onDone={ans => finish(run, ans)} />;
  if (view) {
    const quiz = quizzes.find(q => q.id === view), at = mine(view);
    if (quiz && at) return (
      <Card title="Quiz Result" right={<button className="btn btn-gray" onClick={() => setView(null)}>Back to quizzes</button>}>
        <div className="text-center py-4"><div className="text-5xl font-bold text-uos">{at.score}/{at.total}</div><div className="text-gray-600">{Math.round(at.score * 100 / at.total)}% · {quiz.title}</div></div>
        {quiz.questions.map((q, i) => (
          <div key={i} className="border rounded p-3 mb-3"><div className="font-medium text-sm">{i + 1}. {q.q}</div>
            {q.opts.map((o, j) => <div key={j} className={`text-sm px-2 py-1 mt-1 rounded ${j === q.ans ? 'bg-green-100 text-green-800 font-medium' : at.answers[i] === j ? 'bg-red-100 text-red-700' : ''}`}>{o}{j === q.ans && ' ✓'}{at.answers[i] === j && j !== q.ans && ' ✗ (your answer)'}</div>)}</div>
        ))}
      </Card>
    );
  }
  return (
    <Card title="Online Quizzes">
      {quizzes.length === 0 ? <Empty>No quizzes available.</Empty> : (
        <div className="overflow-x-auto"><table className="tbl"><thead><tr><th>S.NO</th><th>QUIZ</th><th>COURSE</th><th>QUESTIONS</th><th>TIME</th><th>STATUS</th><th></th></tr></thead>
          <tbody>{quizzes.map((q, i) => { const a = mine(q.id); return (
            <tr key={q.id}><td>{i + 1}</td><td className="font-medium">{q.title}</td><td>{cName(q.course)}</td><td>{q.questions.length}</td><td>{q.minutes} min</td>
              <td>{a ? <span className="text-green-700 font-bold">Score {a.score}/{a.total}</span> : <span className="text-amber-700 font-bold">Not attempted</span>}</td>
              <td>{a ? <button className="btn btn-gray !py-1" onClick={() => setView(q.id)}>Review</button> : <button className="btn !py-1" onClick={() => setRun(q)}>Start quiz</button>}</td></tr>); })}</tbody></table></div>
      )}
      <p className="text-xs text-gray-500 mt-3">Each quiz can be attempted once. It auto-submits when the timer ends.</p>
    </Card>
  );
}
function QuizRunner({ quiz, onDone }) {
  const [ans, setAns] = useState({});
  const [left, setLeft] = useState(quiz.minutes * 60);
  const ref = useRef(ans); ref.current = ans;
  const done = useRef(false);
  const submit = () => { if (done.current) return; done.current = true; onDone(ref.current); };
  useEffect(() => { const id = setInterval(() => setLeft(l => l - 1), 1000); return () => clearInterval(id); }, []);
  useEffect(() => { if (left <= 0) submit(); }, [left]);
  const answered = Object.keys(ans).length;
  return (
    <Card title={quiz.title} right={<span className={`px-3 py-1 rounded font-bold ${left < 60 ? 'bg-red-500' : 'bg-white/20'}`}>⏱ {pad(Math.max(0, Math.floor(left / 60)))}:{pad(Math.max(0, left % 60))}</span>}>
      <div className="text-sm text-gray-600 mb-3">{cName(quiz.course)} · Answered {answered}/{quiz.questions.length}</div>
      {quiz.questions.map((q, i) => (
        <div key={i} className="border rounded p-4 mb-3">
          <div className="font-medium mb-2">{i + 1}. {q.q}</div>
          {q.opts.map((o, j) => <label key={j} className={`flex items-center gap-2 px-3 py-2 rounded cursor-pointer ${ans[i] === j ? 'bg-blue-50 border border-uos' : 'hover:bg-gray-50 border border-transparent'}`}><input type="radio" name={'q' + i} checked={ans[i] === j} onChange={() => setAns(a => ({ ...a, [i]: j }))} />{o}</label>)}
        </div>
      ))}
      <div className="text-right"><button className="btn btn-green" onClick={() => { if (answered < quiz.questions.length && !window.confirm('Some questions are unanswered. Submit anyway?')) return; submit(); }}>Submit quiz</button></div>
    </Card>
  );
}
function QuizTeacher() {
  const { quizzes, setQuizzes, attempts } = useApp();
  const blank = () => ({ title: '', course: TEACHER_COURSES[0], minutes: 5, questions: [{ q: '', opts: ['', '', '', ''], ans: 0 }] });
  const [form, setForm] = useState(blank());
  const [err, setErr] = useState('');
  const [show, setShow] = useState(null);
  const setQ = (i, patch) => setForm(f => ({ ...f, questions: f.questions.map((q, j) => (j === i ? { ...q, ...patch } : q)) }));
  const publish = () => {
    if (!form.title.trim()) return setErr('Enter a quiz title.');
    for (let i = 0; i < form.questions.length; i++) { const q = form.questions[i]; if (!q.q.trim() || q.opts.some(o => !o.trim())) return setErr(`Question ${i + 1}: fill the question and all four options.`); }
    setQuizzes(x => [{ id: uid(), title: form.title.trim(), course: form.course, minutes: Number(form.minutes) || 5, questions: form.questions, ts: Date.now() }, ...x]);
    setForm(blank()); setErr('');
  };
  return (
    <>
      <Card title="Create Online Quiz">
        <div className="grid md:grid-cols-[1fr_1fr_120px] gap-x-3">
          <div><label className="lbl !mt-0">Quiz title</label><input className="inp" value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="e.g. SCD Quiz 2" /></div>
          <div><label className="lbl !mt-0">Course</label><CourseSelect value={form.course} onChange={v => setForm({ ...form, course: v })} codes={TEACHER_COURSES} /></div>
          <div><label className="lbl !mt-0">Minutes</label><input type="number" min="1" className="inp" value={form.minutes} onChange={e => setForm({ ...form, minutes: e.target.value })} /></div>
        </div>
        {form.questions.map((q, i) => (
          <div key={i} className="border rounded p-3 mt-4 bg-gray-50">
            <div className="flex justify-between items-center"><b className="text-sm">Question {i + 1}</b>{form.questions.length > 1 && <button className="text-red-600 text-xs" onClick={() => setForm(f => ({ ...f, questions: f.questions.filter((_, j) => j !== i) }))}>Remove</button>}</div>
            <input className="inp mt-2" placeholder="Question text" value={q.q} onChange={e => setQ(i, { q: e.target.value })} />
            {q.opts.map((o, j) => (
              <div key={j} className="flex items-center gap-2 mt-2"><input type="radio" name={'ans' + i} checked={q.ans === j} onChange={() => setQ(i, { ans: j })} title="Correct answer" />
                <input className="inp" placeholder={`Option ${String.fromCharCode(65 + j)}`} value={o} onChange={e => setQ(i, { opts: q.opts.map((x, k) => (k === j ? e.target.value : x)) })} /></div>
            ))}
            <div className="text-[11px] text-gray-500 mt-1">Select the radio button next to the correct option.</div>
          </div>
        ))}
        {err && <div className="text-red-600 text-sm mt-3">{err}</div>}
        <div className="flex justify-between mt-4 flex-wrap gap-2"><button className="btn btn-gray inline-flex items-center gap-1" onClick={() => setForm(f => ({ ...f, questions: [...f.questions, { q: '', opts: ['', '', '', ''], ans: 0 }] }))}><Icon n="plus" size={16} />Add question</button><button className="btn btn-green" onClick={publish}>Publish quiz</button></div>
      </Card>
      <Card title="Published Quizzes & Results">
        {quizzes.length === 0 ? <Empty>No quizzes yet.</Empty> : quizzes.map(q => {
          const at = attempts.filter(a => a.quizId === q.id);
          return (
            <div key={q.id} className="border rounded p-3 mb-3">
              <div className="flex flex-wrap items-center gap-2 justify-between"><div><div className="font-bold">{q.title}</div><div className="text-xs text-gray-500">{cName(q.course)} · {q.questions.length} questions · {q.minutes} min · {at.length} attempt(s)</div></div>
                <div className="flex gap-2"><button className="btn btn-gray !py-1" onClick={() => setShow(show === q.id ? null : q.id)}>{show === q.id ? 'Hide results' : 'View results'}</button><button className="btn btn-red !py-1" onClick={() => { if (window.confirm('Delete this quiz?')) setQuizzes(x => x.filter(y => y.id !== q.id)); }}>Delete</button></div></div>
              {show === q.id && (at.length === 0 ? <div className="text-sm text-gray-500 mt-2">No attempts yet.</div> : <table className="tbl mt-2"><thead><tr><th>ROLL NO</th><th>NAME</th><th>SCORE</th><th>%</th><th>SUBMITTED</th></tr></thead><tbody>{at.map(a => <tr key={a.id}><td>{a.roll}</td><td>{a.name}</td><td>{a.score}/{a.total}</td><td>{Math.round(a.score * 100 / a.total)}%</td><td>{timeAgo(a.ts)}</td></tr>)}</tbody></table>)}
            </div>
          );
        })}
      </Card>
    </>
  );
}

function ReportsStudent() {
  const { sessions, marks, attempts, quizzes } = useApp();
  const rows = COURSES.filter(c => c.sem === 'Sixth Semester').map(c => {
    const a = attOf(sessions, STUDENT.roll, c.code), m = marks[c.code] && marks[c.code][STUDENT.roll];
    return { c, a, r: m ? calc(m, c.cr) : null };
  });
  const done = rows.filter(r => r.r && !r.r.blank);
  const sgpa = done.length ? (done.reduce((x, r) => x + r.r.qp, 0) / done.reduce((x, r) => x + r.c.cr, 0)).toFixed(2) : '--';
  const avg = done.length ? Math.round(done.reduce((x, r) => x + r.r.obt, 0) / done.length) : 0;
  const T = rows.reduce((x, r) => x + r.a.t, 0), P = rows.reduce((x, r) => x + r.a.p, 0), att = T ? Math.round(P * 100 / T) : 0;
  const myAt = attempts.filter(a => a.roll === STUDENT.roll);
  return (
    <Card title="My Performance Report">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <Chip label="SGPA (6th SEM)" value={sgpa} sub="from published marks" tone="green" />
        <Chip label="AVERAGE MARKS" value={avg + '%'} sub={`${done.length} courses`} tone="blue" />
        <Chip label="ATTENDANCE" value={att + '%'} sub={att < 75 ? 'Below 75%' : 'Eligible for exams'} tone={att < 75 ? 'red' : 'green'} />
        <Chip label="QUIZZES TAKEN" value={myAt.length} sub={`of ${quizzes.length}`} tone="amber" />
      </div>
      <div className="overflow-x-auto"><table className="tbl"><thead><tr><th>COURSE</th><th>ATTENDANCE</th><th>MARKS</th><th>GRADE</th></tr></thead>
        <tbody>{rows.map(({ c, a, r }) => (
          <tr key={c.code}><td><div className="font-medium">{c.name}</div><div className="text-xs text-gray-500">{c.code}</div></td>
            <td className="min-w-[160px]"><div className="flex items-center gap-2">{a.t ? <><Pct v={a.pct} t={a.t} /><Bar v={a.pct} /></> : <span className="text-gray-400">No classes yet</span>}</div></td>
            <td className="min-w-[160px]">{r && !r.blank ? <div className="flex items-center gap-2"><b>{r.obt}</b><Bar v={r.obt} color="#337ab7" /></div> : <span className="badge-proc">IN PROCESS</span>}</td>
            <td className="font-bold">{r && !r.blank ? r.g : '--'}</td></tr>))}</tbody></table></div>
      {myAt.length > 0 && <div className="mt-5"><div className="font-bold mb-2">Quiz scores</div>{myAt.map(a => { const qz = quizzes.find(q => q.id === a.quizId); return <div key={a.id} className="text-sm py-1 border-b">{qz ? qz.title : 'Quiz'}: <b>{a.score}/{a.total}</b></div>; })}</div>}
    </Card>
  );
}
function ReportsTeacher() {
  const { sessions, marks } = useApp();

  const withMarks = rows.filter(x => x.r && !x.r.blank);

        <Chip label="AVG MARKS" value={withMarks.length ? Math.round(withMarks.reduce((x, r) => x + r.r.obt, 0) / withMarks.length) : '--'} sub={`${withMarks.length} graded`} tone="blue" />

            <td className="min-w-[150px]"><div className="flex items-center gap-2">{x.a.t ? <><Pct v={x.a.pct} t={x.a.t} /><Bar v={x.a.pct} /></> : <span className="text-gray-400">-</span>}</div></td>
            <td className="min-w-[130px]">{x.r && !x.r.blank ? <div className="flex items-center gap-2"><b>{x.r.obt}</b><Bar v={x.r.obt} color="#337ab7" /></div> : <span className="text-gray-400">Not entered</span>}</td>
            <td className="font-bold">{x.r && !x.r.blank ? x.r.g : '-'}</td>
            <td>{risk(x) ? <span className="text-xs bg-red-100 text-red-700 font-bold rounded px-2 py-0.5">At risk</span> : <span className="text-xs bg-green-100 text-green-700 font-bold rounded px-2 py-0.5">On track</span>}</td></tr>))}</tbody></table></div>

  );

    <Card title="HEC Survey Form: Youth Experiences, Opinions, and Future Outlook">
      <p className="text-red-600 font-bold mb-4">This anonymous survey collects your views as a university student in Pakistan. Your responses are completely confidential and used only for research.</p>
      {a ? <div className="bg-green-50 border border-green-300 text-green-800 rounded p-4">Survey submitted on {fmtLong(a.ts)}. Thank you for your response.</div> : (
        <>
          <label className="lbl !mt-0">How would you rate your overall university experience?</label><select className="inp" value={f.q1} onChange={e => setF({ ...f, q1: e.target.value })}><option value="">Select…</option>{['Very poor', 'Poor', 'Average', 'Good', 'Excellent'].map(o => <option key={o}>{o}</option>)}</select>
          <label className="lbl">How confident are you about your career after graduation?</label><select className="inp" value={f.q2} onChange={e => setF({ ...f, q2: e.target.value })}><option value="">Select…</option>{['Not confident', 'Somewhat confident', 'Confident', 'Very confident'].map(o => <option key={o}>{o}</option>)}</select>
          <label className="lbl">What would improve student life at your university?</label><textarea className="inp" rows={3} value={f.q3} onChange={e => setF({ ...f, q3: e.target.value })} />
          <button className="btn mt-4" disabled={!f.q1 || !f.q2} onClick={() => setA({ ...f, ts: Date.now() })}>Submit survey</button>
        </>
      )}
    </Card>
  );
}
function PickDrop() {
  const rows = [['Hyderabad (Latifabad Unit 7)', '06:45 AM', '04:15 PM', 'Bus 01'], ['Hyderabad (Hirabad Chowk)', '07:00 AM', '04:30 PM', 'Bus 02'], ['Kotri Bus Stop', '07:20 AM', '04:50 PM', 'Bus 03'], ['Jamshoro Railway Station', '07:45 AM', '05:00 PM', 'Bus 04'], ['Sehwan Road, Manjhand', '07:30 AM', '04:45 PM', 'Bus 05']];
  return <Card title="Points Pick/Drop Locations"><div className="overflow-x-auto"><table className="tbl"><thead><tr><th>S.NO</th><th>POINT</th><th>PICK-UP</th><th>DROP</th><th>BUS</th></tr></thead><tbody>{rows.map((r, i) => <tr key={i}><td>{i + 1}</td>{r.map((c, j) => <td key={j}>{c}</td>)}</tr>)}</tbody></table></div></Card>;
}
function Library() {
  const [q, setQ] = useState('');
  const [res, setRes] = useLS('reserved', []);
  const books = [['Software Engineering', 'Ian Sommerville', 'Available'], ['Clean Code', 'Robert C. Martin', 'Available'], ['Operating System Concepts', 'Silberschatz, Galvin', 'Issued'], ['Design Patterns', 'Gamma et al.', 'Available'], ['Code Complete', 'Steve McConnell', 'Available'], ['Computer Networks', 'Andrew Tanenbaum', 'Issued'], ['Human-Computer Interaction', 'Alan Dix', 'Available'], ['Cryptography and Network Security', 'William Stallings', 'Available'], ["Software Engineering: A Practitioner's Approach", 'Roger Pressman', 'Available']];
  const list = books.filter(b => (b[0] + b[1]).toLowerCase().includes(q.toLowerCase()));
  return (
    <Card title="Koha Library">
      <input className="inp mb-3" placeholder="Search by title or author" value={q} onChange={e => setQ(e.target.value)} />
      <div className="overflow-x-auto"><table className="tbl"><thead><tr><th>TITLE</th><th>AUTHOR</th><th>STATUS</th><th></th></tr></thead>
        <tbody>{list.map(b => <tr key={b[0]}><td className="font-medium">{b[0]}</td><td>{b[1]}</td><td className={b[2] === 'Available' ? 'text-green-700 font-bold' : 'text-red-600 font-bold'}>{b[2]}</td>
          <td><button className={`btn !py-1 ${res.includes(b[0]) ? 'btn-gray' : ''}`} onClick={() => setRes(r => (r.includes(b[0]) ? r.filter(x => x !== b[0]) : [...r, b[0]]))}>{res.includes(b[0]) ? 'Cancel reservation' : 'Reserve'}</button></td></tr>)}</tbody></table></div>
      {list.length === 0 && <Empty>No books match your search.</Empty>}
    </Card>
  );
}
function Hostel() {
  const [req, setReq] = useLS('hostelreq', null);
  const [type, setType] = useState('Double sharing');
  return (
    <Card title="Hostel: Form / Paid Fees History">
      <div className="font-bold mb-2">Paid fees history</div>
      <div className="overflow-x-auto"><table className="tbl"><thead><tr><th>S.NO</th><th>CHALLAN</th><th>AMOUNT</th><th>PAID ON</th></tr></thead><tbody><tr><td colSpan={4} className="text-center text-gray-500 py-6">No hostel payments found for {STUDENT.roll}.</td></tr></tbody></table></div>
      <div className="font-bold mt-5 mb-2">Hostel admission form</div>
      {req ? <div className="bg-green-50 border border-green-300 text-green-800 rounded p-4 text-sm">Request for “{req.type}” submitted on {fmtLong(req.ts)}. The provost office will contact you.</div> : (
        <><label className="lbl !mt-0">Room type</label><select className="inp max-w-sm" value={type} onChange={e => setType(e.target.value)}><option>Single</option><option>Double sharing</option><option>Triple sharing</option></select>
          <button className="btn mt-3" onClick={() => setReq({ type, ts: Date.now() })}>Submit hostel form</button></>
      )}
    </Card>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
